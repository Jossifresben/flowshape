<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>flowshape.art — mathematical patterns into print-ready posters</title>
    <!-- Pattern count (30) is hardcoded in four places below: this description,
         og:description, twitter:description and the JSON-LD description. Bump all
         four when a pattern is added to the registry. src/ui/about.ts fills its
         count from the live registry at runtime, so it needs no change. -->
    <meta
      name="description"
      content="flowshape turns mathematics into art. Play with 30 pattern generators, tune every parameter, and take the result out as a print-ready SVG or PNG — or set it moving to music. Every pattern shows its formula and its code, in English and Spanish. Free, open source, runs entirely in your browser."
    />
    <link rel="canonical" href="https://flowshape.art/" />
    <meta name="theme-color" content="#17171a" />
    <meta name="color-scheme" content="dark" />
    <meta name="author" content="Jossi Fresco Benaim" />

    <!-- Favicons. favicon.ico at the site root is picked up without a tag. -->
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph. Routing is hash-based, so a crawler only ever sees this
         one document: the English card is the default and the Spanish one is
         offered as the alternate locale's image. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="flowshape.art" />
    <meta property="og:url" content="https://flowshape.art/" />
    <meta property="og:title" content="flowshape.art — shape mathematics into art" />
    <meta
      property="og:description"
      content="30 mathematical pattern generators. Tune every parameter, read the formula behind it, then print it or set it moving to music. Free and open source."
    />
    <meta property="og:image" content="https://flowshape.art/og-en-v2.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="flowshape.art — shape mathematics into art" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:image" content="https://flowshape.art/og-es-v2.png" />
    <meta property="og:image:alt" content="flowshape.art — convierte las matemáticas en arte" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="flowshape.art — shape mathematics into art" />
    <meta
      name="twitter:description"
      content="30 mathematical pattern generators. Tune every parameter, read the formula behind it, then print it or set it moving to music. Free and open source."
    />
    <meta name="twitter:image" content="https://flowshape.art/og-en-v2.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "flowshape",
        "url": "https://flowshape.art/",
        "applicationCategory": "DesignApplication",
        "operatingSystem": "Any browser",
        "inLanguage": ["en", "es"],
        "isAccessibleForFree": true,
        "license": "https://opensource.org/licenses/MIT",
        "description": "flowshape turns mathematics into art: 30 pattern generators with every parameter exposed, exported as print-ready vector artwork or driven as an audio-reactive visual.",
        "author": {
          "@type": "Person",
          "name": "Jossi Fresco Benaim",
          "url": "https://jossifresco.com",
          "identifier": "https://orcid.org/0009-0000-2026-0836"
        },
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
